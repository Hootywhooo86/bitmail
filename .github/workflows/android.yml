name: Android APK

# Builds the bitmail Android app (a Trusted Web Activity around the live web app) on every
# push that touches it. Pushes to main also publish the APK to the "android-latest" release.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bitmail.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bitmail-apk
          path: bitmail.apk

      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest \
            --title "bitmail for Android" --latest \
            --notes "Download **bitmail.apk** on your Android phone and open it to install (allow installs from your browser when asked). It opens bitmail in Chrome full-screen, so Google sign-in works. This release is rebuilt automatically from main."
          gh release upload android-latest bitmail.apk --clobber
